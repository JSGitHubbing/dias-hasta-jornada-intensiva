<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Contador que muestra cuántas tardes quedan hasta la jornada intensiva"
    />
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/counter.css">
    <link rel="stylesheet" href="styles.css">

    <link rel="icon" type="image/x-icon" href="resources/favicon.ico" />
    <title>Jornada Intensiva</title>
  </head>

  <body>
    <nav>
        <img id="config-button" class="icon-button clickable" src="resources/gear.svg" aria-hidden="true">
    </nav>
    <main>
      <div id="counter-container" class="counter-container">
        <div class="counter-background pulse"></div>
        <div class="counter-background"></div>
        <div id="counter">&nbsp;</div>
      </div>
      <h1 id="texto-dias">&nbsp;</h1>
    </main>
    <div id="dialog">
      <div id="config-dialog-backdrop" class="background-shadow"></div>
      <div class="dialog card">
        <h1>Selecciona el rango de fechas</h1>
        <div class="input-group">
          <label for="config-dialog-start-date-input">Fecha de inicio de jornada intensiva</label>
          <input id="config-dialog-start-date-input" type="date">
        </div>
        <div class="input-group">
          <label for="config-dialog-end-date-input">Fecha de fin de jornada intensiva</label>
          <input id="config-dialog-end-date-input" type="date">
        </div>
        <div class="input-group">
          <label for="config-dialog-calculation-config">Tipo de cálculo</label>
          <select name="config-dialog-calculation-config" id="config-dialog-calculation-config">
            <option value="0">Días naturales</option>
            <option value="1">Días laborables</option>
            <option value="2">Tardes laborables</option>
          </select>
        </div>
        <button id="config-dialog-confirm-button" class="dialog-button clickable">Confirmar</button>
      </div>
    </div>
  </body>
</html>
